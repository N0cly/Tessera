name: Claude review

# Automated PR review via Claude. Requires the ANTHROPIC_API_KEY secret
# (set up with `claude /install-github-app`). No secret values live in this file.
#
# Fork safety: GitHub does not expose secrets to PRs from forks, so this job is
# skipped on external contributors' PRs — a maintainer can re-run it with
# "Approve and run". Core CI (ci.yml) is secret-free and always runs.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    runs-on: ubuntu-latest
    # Only run when the PR comes from this repo (secrets are available).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Auto-supplied by Actions; passed explicitly so the bot can post the review.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Defaults to Sonnet. To use Opus, pass the model via claude_args:
          # claude_args: "--model claude-opus-4-8"
          prompt: |
            Review this pull request and leave concise, actionable inline comments.
            Tessera is a self-hostable dynamic-QR platform; hold the change to the
            architectural invariants in CLAUDE.md and docs/ARCHITECTURE.md:
              - GET /r/{slug} must return 302 (never 301) and stay OUTSIDE API Platform.
              - Scan logging stays async (Symfony Messenger); the redirect never blocks on the DB.
              - Raw scanner IPs are NEVER persisted (the scans table has no IP column).
              - The Redis slug cache is invalidated on Link writes / subscription changes.
              - New user-facing strings are i18n keys present in ALL five locales (en, fr, es, it, de).
              - No secrets committed; destination URLs stay http(s)-only.
            Also flag security issues, missing tests, and unclear code. Be brief and specific.
