# Keep dependencies and CI actions patched. Weekly, grouped to limit PR noise.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Frontend — npm (Angular app)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-*/*'
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Backend — Composer (Symfony app)
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      symfony:
        patterns:
          - 'symfony/*'
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
