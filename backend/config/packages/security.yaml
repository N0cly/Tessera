security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        register:
            pattern: ^/api/register
            stateless: true
            security: false

        redirect:
            pattern: ^/r/
            stateless: true
            security: false

        billing_webhook:
            # Public: the provider has no JWT. Authenticity is enforced by the
            # HMAC signature check inside the controller, not by the firewall.
            pattern: ^/api/webhooks/billing
            stateless: true
            security: false

        admin_login:
            # The admin 2FA login does its own verification (password + TOTP +
            # admin role) and mints an admin-scoped JWT. Must precede ^/admin.
            pattern: ^/admin/login
            stateless: true
            security: false

        admin:
            # Operator panel. JWT-authenticated; the real authorization (admin
            # role + 2FA scope claim + optional IP allowlist) is enforced
            # server-side per endpoint by App\Service\AdminContext.
            pattern: ^/admin
            stateless: true
            provider: app_user_provider
            jwt: ~

        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/r/, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/pricing, roles: PUBLIC_ACCESS }
        - { path: ^/api/config, roles: PUBLIC_ACCESS }
        - { path: ^/api/demo, roles: PUBLIC_ACCESS }
        - { path: ^/api/webhooks/billing, roles: PUBLIC_ACCESS }
        # Admin: login is public (does its own auth); everything else under
        # /admin needs a valid JWT, then AdminContext enforces admin+2FA.
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
