framework:
    cache:
        # Default Symfony cache uses the filesystem.
        # We expose a dedicated Redis-backed pool for the slug → destinationUrl
        # hot path. Cache invalidation runs on every Link write (Doctrine listener),
        # plus a safety TTL covers any miss.
        default_redis_provider: '%env(REDIS_URL)%'

        pools:
            app.cache.links:
                adapter: cache.adapter.redis
                default_lifetime: 3600 # safety TTL: 1 hour

            app.cache.rate_limiter:
                adapter: cache.adapter.redis
                default_lifetime: 600

            # Short-lived cache of the Paddle pricing catalogue so /api/pricing
            # never calls Paddle per page view. The actual TTL is set per item
            # by PricingCatalog (PRICING_CACHE_TTL, shorter when degraded); this
            # is just the pool default backstop.
            app.cache.pricing:
                adapter: cache.adapter.redis
                default_lifetime: 600

            # Cache of the admin panel's Paddle-sourced business KPIs so the
            # operator panel never calls Paddle per view (ADMIN_METRICS_CACHE_TTL).
            app.cache.admin:
                adapter: cache.adapter.redis
                default_lifetime: 300
