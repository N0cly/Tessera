framework:
    default_locale: en
    # The locales the app ships translations for (en is default + fallback).
    enabled_locales: ['en', 'fr', 'es', 'it', 'de']
    set_locale_from_accept_language: false
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['en']
        providers:
