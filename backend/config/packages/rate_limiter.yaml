framework:
    rate_limiter:
        # Per-user limiter applied on POST /api/links to keep self-hosted
        # instances safe from runaway scripts hammering the create endpoint.
        # Token-bucket so legitimate bursts (e.g. importing a few links by
        # hand) still go through. Override LINK_CREATION_RATE_PER_MINUTE
        # in your .env to tune for trusted environments.
        link_creation:
            policy: 'token_bucket'
            limit: '%env(int:LINK_CREATION_BURST)%'
            rate:
                interval: '1 minute'
                amount: '%env(int:LINK_CREATION_RATE_PER_MINUTE)%'
            cache_pool: 'app.cache.rate_limiter'

        # Per-IP brute-force defence on the operator admin login. Strict by
        # default — admin login is rare and high-value (CLAUDE.md rule 17).
        admin_login:
            policy: 'token_bucket'
            limit: '%env(int:ADMIN_LOGIN_BURST)%'
            rate:
                interval: '1 minute'
                amount: '%env(int:ADMIN_LOGIN_RATE_PER_MINUTE)%'
            cache_pool: 'app.cache.rate_limiter'

        # Per-IP cap on demo-session creation (anti session-spam, CLAUDE.md
        # rule 19). Only consulted when DEMO_MODE is on.
        demo_session:
            policy: 'token_bucket'
            limit: '%env(int:DEMO_SESSION_BURST)%'
            rate:
                interval: '1 minute'
                amount: '%env(int:DEMO_SESSION_RATE_PER_MINUTE)%'
            cache_pool: 'app.cache.rate_limiter'
