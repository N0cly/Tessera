services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}", "-d", "${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-change-me-in-env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      GEOIP_DATABASE_PATH: /app/var/geoip/GeoLite2-Country.mmdb
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-change-me-in-env}
      LINK_CREATION_RATE_PER_MINUTE: ${LINK_CREATION_RATE_PER_MINUTE:-10}
      LINK_CREATION_BURST: ${LINK_CREATION_BURST:-20}
      LINK_DESTINATION_DENYLIST: ${LINK_DESTINATION_DENYLIST:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_LINK_TTL_HOURS: ${DEMO_LINK_TTL_HOURS:-24}
      # Billing (Merchant of Record: Paddle). Secrets stay empty here; set them
      # in your root .env / secret store. Empty = billing disabled gracefully.
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-14}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-30}
      PLAN_TRIAL_CODE_LIMIT: ${PLAN_TRIAL_CODE_LIMIT:-25}
      PLAN_PRO_CODE_LIMIT: ${PLAN_PRO_CODE_LIMIT:-0}
      PADDLE_API_BASE_URL: ${PADDLE_API_BASE_URL:-https://sandbox-api.paddle.com}
      PADDLE_PRICE_ID: ${PADDLE_PRICE_ID:-}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      # Only the backend container runs migrations on boot to avoid races
      # with the worker. The script is idempotent either way.
      RUN_MIGRATIONS: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_var:/app/var
      - ./backend/var/geoip:/app/var/geoip:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health') === '{\"status\":\"ok\"}' ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Async worker that drains the Redis-backed Messenger transport. Scan
  # records (UA parsing + IP→country lookup) happen here, NOT on the
  # redirect hot path. Restarts itself periodically so memory and DB
  # connections stay fresh.
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600", "--memory-limit=128M"]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-change-me-in-env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      GEOIP_DATABASE_PATH: /app/var/geoip/GeoLite2-Country.mmdb
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-change-me-in-env}
      LINK_CREATION_RATE_PER_MINUTE: ${LINK_CREATION_RATE_PER_MINUTE:-10}
      LINK_CREATION_BURST: ${LINK_CREATION_BURST:-20}
      LINK_DESTINATION_DENYLIST: ${LINK_DESTINATION_DENYLIST:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_LINK_TTL_HOURS: ${DEMO_LINK_TTL_HOURS:-24}
      RUN_MIGRATIONS: "0"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_var:/app/var
      - ./backend/var/geoip:/app/var/geoip:ro

  # Periodic janitor. Runs the demo-link purge in a sleep-loop. No-op when
  # DEMO_USER_EMAIL is empty (default), so it's safe to leave running.
  # Tuned to wake every 15 minutes — fine-grained enough for hour-scale TTL.
  cron:
    build:
      context: ./backend
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'while true; do sleep ${DEMO_PURGE_INTERVAL_SECONDS:-900}; php bin/console app:demo:purge --no-interaction || true; done'
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-change-me-in-env}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-change-me-in-env}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_LINK_TTL_HOURS: ${DEMO_LINK_TTL_HOURS:-24}
      RUN_MIGRATIONS: "0"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_var:/app/var

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_vendor:
  backend_var:
  frontend_node_modules:
